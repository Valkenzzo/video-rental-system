<div class="row">
    <div class="col-md-8">
        <input type="text" class="form-control mb-3" placeholder="Keresés id alapján..." (input)="searchId($event)">
        <input type="text" class="form-control mb-3" placeholder="Keresés cím alapján..." (input)="searchTitle($event)">

        <table class="table  table-hover align-middle">
            <thead>
                <tr>
                    <th>Egyedi azonosító</th>
                    <th>Cím</th>
                    <th>Beszerzés dátuma</th>
                    <th>Státusz</th>
                </tr>
            </thead>
            <tbody>
                @for (video of filteredVideos(); track video.id) {
                <tr>
                    <td>{{ video.id }}</td>
                    <td>{{ video.title }}</td>
                    <td>{{ video.dateOfPurchase | date:'yyyy-MM-dd' }}</td>
                    <td>{{ video.status === 'Free'
                        ? 'Szabad'
                        : video.status === 'Rented'
                        ? 'Kikölcsönzött'
                        : 'Selejtezett' }}</td>
                    <td>
                        <button class="btn  btn-dark btn-sm me-2" (click)="editVideo(video)">Szerkesztés</button>
                        <button class="btn  btn-danger btn-sm" (click)="deleteVideo(video)">Törlés</button>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
