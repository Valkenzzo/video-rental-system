<div class="row">
    <div class="col-md-8">
  
        <table class="table  table-hover align-middle">
            <thead >
                <tr>
                    <th>Kölcsönző azonosítója</th>
                    <th>Kölcsönző neve</th>
                    <th>DVD/Kazetta azonosítója</th>
                    <th>DVD/Kazetta címe</th>
                    <th>Kölcsönzés dátuma</th>
                    <th>Visszahozás dátuma</th>
                </tr>
            </thead>
            <tbody>
                    @for (rent of rents(); track rent.id) {
                <tr>
                    <td>{{ rent.customer.id }}</td>
                    <td>{{ rent.customer.name }}</td>
                    <td>{{ rent.video.id }}</td>
                    <td>{{ rent.video.title }}</td>
                    <td>{{ rent.rentDate }}</td>
                    <td>{{ rent.returnDate }}</td>
                </tr>
            }
            </tbody>
        </table>
    </div>
</div>
